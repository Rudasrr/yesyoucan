name: Záloha databáze
# Každou neděli ve 3:00 UTC + ručně (Actions → Záloha databáze → Run workflow).
# Data jsou zašifrovaná heslem BACKUP_PASSPHRASE (repozitář je veřejný – artefakty
# veřejného repa si může stáhnout kdokoli přihlášený). Rozšifrování: viz NAVOD.md A6.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 tools/backup.py zaloha.json
      - name: Šifrování
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # openssl, ne gpg – rozšifruje se na Macu bez instalace čehokoli (viz NAVOD.md A6)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in zaloha.json -out zaloha.json.enc
          rm zaloha.json
      - uses: actions/upload-artifact@v4
        with:
          name: zaloha-${{ github.run_number }}
          path: zaloha.json.enc
          retention-days: 90
